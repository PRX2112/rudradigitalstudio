<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#181a20" />
      <stop offset="60%" stop-color="#0b0c10" />
      <stop offset="100%" stop-color="#050607" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fceddf" />
      <stop offset="35%" stop-color="#d4a389" />
      <stop offset="70%" stop-color="#b68164" />
      <stop offset="100%" stop-color="#8c583e" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#fceddf" />
      <stop offset="100%" stop-color="#d4a389" />
    </linearGradient>
  </defs>

  <!-- Outer Circular Obsidian Base -->
  <circle cx="256" cy="256" r="248" fill="url(#bgGrad)" />

  <!-- Outer Polished Gold / Copper Ring -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#goldGrad)" stroke-width="14" />

  <!-- Delicate Inner Concentric Ring -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="#d4a389" stroke-width="2.5" stroke-opacity="0.4" stroke-dasharray="10 8" />

  <!-- 8 Subtle Camera Aperture Calibration Marks -->
  <g stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" opacity="0.65">
    <line x1="256" y1="46" x2="256" y2="62" />
    <line x1="256" y1="450" x2="256" y2="466" />
    <line x1="46" y1="256" x2="62" y2="256" />
    <line x1="450" y1="256" x2="466" y2="256" />
    <line x1="108" y1="108" x2="120" y2="120" />
    <line x1="404" y1="108" x2="392" y2="120" />
    <line x1="108" y1="404" x2="120" y2="392" />
    <line x1="404" y1="404" x2="392" y2="392" />
  </g>

  <!-- Top Diamond Sparkle Star -->
  <path d="M256 78 L261 95 L278 100 L261 105 L256 122 L251 105 L234 100 L251 95 Z" fill="url(#goldGrad)" />

  <!-- Center Monogram "RDS" in Editorial Serif -->
  <text
    x="256"
    y="298"
    text-anchor="middle"
    font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif"
    font-size="168"
    font-weight="700"
    letter-spacing="12"
    fill="url(#textGrad)"
  >RDS</text>

  <!-- Subtitle Tag "STUDIO" -->
  <text
    x="262"
    y="365"
    text-anchor="middle"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"
    font-size="36"
    font-weight="600"
    letter-spacing="12"
    fill="#d4a389"
    opacity="0.9"
  >STUDIO</text>
</svg>
